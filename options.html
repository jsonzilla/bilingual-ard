<!DOCTYPE html>
<html>
<head>
    <title>Bilingual ARD Settings</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            width: 300px;
            background-color: #f4f4f9;
            color: #333;
        }
        h2 {
            font-size: 1.2em;
            margin-bottom: 20px;
            color: #0056b3;
        }
        .setting {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="range"] {
            width: 100%;
        }
        .value-display {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }
        .status {
            font-size: 0.8em;
            color: green;
            height: 1em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h2>Settings</h2>
    
    <div class="setting">
        <label for="font-size">Font Size Scale</label>
        <input type="range" id="font-size" min="0.5" max="5" step="0.1" value="1.0">
        <div class="value-display">Value: <span id="font-size-val">1.0</span>x</div>
    </div>

    <div id="status" class="status"></div>

    <script src="options.js"></script>
</body>
</html>
